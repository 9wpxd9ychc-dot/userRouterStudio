name = "userrouterstudio"
main = "src/index.js"
compatibility_date = "2024-09-23"

# KV создаётся автоматически скриптом scripts/cf-build.sh при первом Cloudflare Build.
# Для локального деплоя: npx wrangler kv namespace create DB, затем вписать id ниже.
# [[kv_namespaces]]
# binding = "DB"
# id = "<ваш-id>"

[triggers]
crons = ["*/10 * * * *"]

# Секреты (Dashboard -> Settings -> Variables and Secrets или wrangler secret put):
# TELEGRAM_BOT_TOKEN, OWNER_ID, WEBHOOK_SECRET
