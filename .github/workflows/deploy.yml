name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm i -g wrangler jq

      - name: Create KV namespace (once) and wire binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ID=$(wrangler kv namespace list --json | jq -r '.[] | select(.title=="userrouterstudio-db") | .id' | head -1 || true)
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            ID=$(wrangler kv namespace create userrouterstudio-db --json | jq -r .id)
          fi
          echo "KV id: $ID"
          printf '\n[[kv_namespaces]]\nbinding = "DB"\nid = "%s"\n' "$ID" >> wrangler.toml

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy | tee /tmp/deploy.log

      - name: Sync secrets + set webhook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$WEBHOOK_SECRET"     | wrangler secret put WEBHOOK_SECRET
          printf '%s' "$OWNER_ID"           | wrangler secret put OWNER_ID
          URL=$(grep -oE 'https://[a-z0-9._-]+\.workers\.dev' /tmp/deploy.log | head -1)
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook?url=${URL}/webhook&secret_token=${WEBHOOK_SECRET}"
